<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dragon Island 3D — Model Preview</title>
    <style>
      html, body { margin: 0; padding: 0; overflow: hidden; width: 100%; height: 100%;
        background: #34495e; font-family: 'Comic Sans MS', 'Segoe UI', sans-serif; }
      #game-canvas { display: block; width: 100%; height: 100%; }
      #hint { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);

  <body>
    <canvas id="game-canvas"></canvas>
    <div id="hint">Drag to orbit · Scroll to zoom · ?yaw=180 to spin the model · ?only=model|proc</div>
