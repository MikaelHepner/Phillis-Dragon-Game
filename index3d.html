<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dragon Island 3D</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        width: 100%;
        height: 100%;
        background: #7ec8e3;
        font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', sans-serif;
      }
      #game-canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      /* Shared chunky chip look */
      .hud-chip {
        display: inline-flex;
        align-items: center;
        background: rgba(255, 255, 255, 0.9);
        border: 3px solid #5a3e2b;
        border-radius: 14px;
        padding: 6px 12px;
        font-size: 18px;
        font-weight: bold;
        color: #5a3e2b;
        box-shadow: 0 3px 0 rgba(0, 0, 0, 0.2);
      }

      /* Top-left: resources + controls hint */
      #top-left {
        position: absolute;
        top: 12px;
        left: 12px;
        pointer-events: none;
        user-select: none;
        max-width: 62vw;
      }
      #resource-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 8px;
      }
      .resource-val { margin-left: 2px; min-width: 1ch; }
      #hint {
        font-size: 13px;
        padding: 5px 10px;
        opacity: 0.9;
      }

      /* Top-right: fps + backpack */
      #top-right {
        position: absolute;
        top: 12px;
        right: 12px;
        display: flex;
        gap: 8px;
        align-items: flex-start;
        user-select: none;
      }
      #fps { font-size: 14px; padding: 4px 10px; pointer-events: none; }
      #backpack-btn {
        cursor: pointer;
        border: none;
        font-family: inherit;
      }
      #backpack-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,0.2); }

      #backpack-panel {
        position: absolute;
        top: 56px;
        right: 12px;
        width: 200px;
        background: rgba(255, 255, 255, 0.96);
        border: 4px solid #5a3e2b;
        border-radius: 18px;
        box-shadow: 0 6px 0 rgba(0, 0, 0, 0.25);
        padding: 10px 14px;
        display: none;
        color: #5a3e2b;
      }
      #backpack-panel.open { display: block; }
      #backpack-panel h3 {
        margin: 2px 0 8px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 18px;
      }
      #backpack-close {
        cursor: pointer;
        border: none;
        background: #e5cfa8;
        border-radius: 8px;
        font-weight: bold;
        padding: 2px 8px;
      }
      #backpack-list { list-style: none; margin: 0; padding: 0; }
      #backpack-list li {
        display: flex;
        justify-content: space-between;
        padding: 5px 2px;
        font-size: 16px;
        border-bottom: 2px dotted rgba(90, 62, 43, 0.25);
      }

      /* Bottom-left: selected-dragon caretaking panel */
      #dragon-panel {
        position: absolute;
        left: 12px;
        bottom: 12px;
        width: 280px;
        background: rgba(255, 255, 255, 0.94);
        border: 4px solid #5a3e2b;
        border-radius: 18px;
        box-shadow: 0 6px 0 rgba(0, 0, 0, 0.25);
        padding: 12px 14px;
        color: #5a3e2b;
        user-select: none;
      }
      #dragon-panel.hidden { display: none; }
      .dragon-name {
        font-size: 20px;
        font-weight: bold;
        margin-bottom: 8px;
      }
      .stat-bars { display: flex; flex-direction: column; gap: 6px; }
      .stat-row { display: flex; align-items: center; gap: 8px; }
      .stat-label { font-size: 16px; width: 20px; text-align: center; }
      .stat-track {
        flex: 1;
        height: 14px;
        background: #e5d5bd;
        border: 2px solid #5a3e2b;
        border-radius: 8px;
        overflow: hidden;
      }
      .stat-fill {
        height: 100%;
        width: 100%;
        border-radius: 6px 0 0 6px;
        transition: width 0.3s ease;
      }
      .bar-hp { background: #e74c3c; }
      .bar-hunger { background: #f39c12; }
      .bar-energy { background: #3498db; }
      .bar-love { background: #e84393; }
      .stat-fill.bar-low { animation: lowpulse 0.8s ease-in-out infinite; }
      @keyframes lowpulse {
        0%, 100% { filter: brightness(1); }
        50% { filter: brightness(1.6); }
      }
      .stat-value {
        font-size: 13px;
        font-weight: bold;
        width: 26px;
        text-align: right;
      }
      .dragon-actions {
        display: flex;
        gap: 6px;
        margin-top: 10px;
      }
      .action-btn {
        flex: 1;
        cursor: pointer;
        font-family: inherit;
        font-size: 14px;
        font-weight: bold;
        color: #5a3e2b;
        background: #ffe08a;
        border: 3px solid #5a3e2b;
        border-radius: 12px;
        padding: 6px 4px;
        box-shadow: 0 3px 0 rgba(0, 0, 0, 0.2);
      }
      .action-btn:hover { background: #ffd75e; }
      .action-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0, 0, 0, 0.2); }

      /* — Batch 6: Dragon Store, Pack Store, card reveal — */

      #store-btn { cursor: pointer; border: none; font-family: inherit; }
      #store-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,0.2); }

      .overlay-panel {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: min(92vw, 620px);
        max-height: 82vh;
        overflow-y: auto;
        background: rgba(255, 251, 240, 0.97);
        border: 4px solid #5a3e2b;
        border-radius: 20px;
        box-shadow: 0 8px 0 rgba(0, 0, 0, 0.28);
        padding: 14px 16px;
        color: #5a3e2b;
        display: none;
        z-index: 10;
        user-select: none;
      }
      .overlay-panel.open { display: block; }
      .panel-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
      }
      .panel-head h3 { margin: 0; font-size: 22px; }
      .panel-head-actions { display: flex; gap: 8px; }
      .panel-btn {
        cursor: pointer;
        font-family: inherit;
        font-size: 15px;
        font-weight: bold;
        color: #5a3e2b;
        background: #ffe08a;
        border: 3px solid #5a3e2b;
        border-radius: 12px;
        padding: 6px 12px;
        box-shadow: 0 3px 0 rgba(0, 0, 0, 0.2);
      }
      .panel-btn:hover { background: #ffd75e; }
      .panel-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0, 0, 0, 0.2); }
      .panel-close {
        cursor: pointer;
        border: 3px solid #5a3e2b;
        background: #e5cfa8;
        border-radius: 10px;
        font-weight: bold;
        font-family: inherit;
        font-size: 15px;
        padding: 4px 10px;
      }

      .store-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
        gap: 10px;
      }
      .store-tile {
        background: #f6ead2;
        border: 3px solid #5a3e2b;
        border-radius: 14px;
        padding: 8px 6px;
        text-align: center;
      }
      .store-thumb {
        width: 84px;
        height: 84px;
        image-rendering: auto;
        filter: drop-shadow(0 3px 2px rgba(0, 0, 0, 0.25));
      }
      .store-name { font-size: 13px; font-weight: bold; min-height: 2.4em; }
      .store-cost { font-size: 14px; font-weight: bold; color: #b8860b; margin: 2px 0 6px; }
      .store-buy {
        cursor: pointer;
        font-family: inherit;
        font-size: 13px;
        font-weight: bold;
        color: #fff;
        background: #3cab4b;
        border: 3px solid #5a3e2b;
        border-radius: 10px;
        padding: 4px 14px;
        box-shadow: 0 2px 0 rgba(0, 0, 0, 0.2);
      }
      .store-buy:hover { filter: brightness(1.1); }
      .store-buy:active { transform: translateY(1px); }
      .store-buy.poor { background: #c0392b; }
      .store-buy.owned { background: #9a9a9a; cursor: default; }

      /* Pack store */
      .pack-body { text-align: center; padding: 6px 0 10px; }
      .pack-visual {
        position: relative;
        width: 150px;
        height: 205px;
        margin: 6px auto 12px;
        border-radius: 14px;
        background: linear-gradient(150deg, #5b2a86, #8e44ad 45%, #3f1d63);
        border: 4px solid #d4af37;
        box-shadow: 0 8px 14px rgba(0, 0, 0, 0.35);
        cursor: pointer;
        overflow: hidden;
        transition: transform 0.15s ease;
      }
      .pack-visual:hover { transform: scale(1.05) rotate(-1.5deg); }
      .pack-art {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 74px;
        filter: drop-shadow(0 3px 3px rgba(0, 0, 0, 0.4));
      }
      .pack-shine {
        position: absolute;
        top: -60%;
        left: -70%;
        width: 55%;
        height: 220%;
        background: rgba(255, 255, 255, 0.25);
        transform: rotate(22deg);
        animation: packshine 2.6s ease-in-out infinite;
      }
      @keyframes packshine {
        0%, 55%, 100% { left: -70%; }
        25% { left: 130%; }
      }
      .pack-name { font-size: 20px; font-weight: bold; }
      .pack-cost { font-size: 16px; font-weight: bold; color: #b8860b; margin: 4px 0 12px; }
      .pack-open-btn { font-size: 18px; background: #3cab4b; color: #fff; }
      .pack-open-btn:hover { background: #359843; }
      .pack-back-btn { display: block; margin: 12px auto 0; font-size: 13px; }

      /* Card reveal overlay */
      #reveal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(10, 6, 20, 0.88);
        z-index: 20;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 26px;
        user-select: none;
      }
      .reveal-title {
        font-size: clamp(28px, 6vw, 44px);
        font-weight: bold;
        color: #67e8f9;
        text-shadow: 0 0 18px rgba(103, 232, 249, 0.6), 0 3px 0 #000;
        letter-spacing: 2px;
        animation: titlepop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      }
      @keyframes titlepop {
        from { transform: scale(0.3); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
      }
      .reveal-row {
        display: flex;
        gap: clamp(10px, 3vw, 30px);
        perspective: 900px;
      }
      .reveal-card {
        width: clamp(96px, 24vw, 170px);
        aspect-ratio: 170 / 245;
      }
      .card-inner {
        position: relative;
        width: 100%;
        height: 100%;
        transform-style: preserve-3d;
        /* 3D flip + overshoot scale ≈ the 2D Back.easeOut pop, 300ms stagger */
        animation: cardflip 0.9s cubic-bezier(0.34, 1.4, 0.64, 1) both;
        animation-delay: calc(var(--i) * 300ms);
      }
      @keyframes cardflip {
        from { transform: rotateY(180deg) scale(0.15); opacity: 0; }
        30% { opacity: 1; }
        to { transform: rotateY(0deg) scale(1); opacity: 1; }
      }
      .card-face {
        position: absolute;
        inset: 0;
        backface-visibility: hidden;
        border-radius: 14px;
        border: 4px solid #00dbe0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
      }
      .card-back {
        transform: rotateY(180deg);
        background: linear-gradient(150deg, #5b2a86, #3f1d63);
        font-size: 54px;
      }
      .card-front {
        background: #191925;
        color: #fff;
        gap: 8px;
        padding: 8px;
        text-align: center;
      }
      .card-icon { font-size: clamp(38px, 9vw, 64px); }
      .card-name { font-size: clamp(13px, 2.6vw, 18px); font-weight: bold; }
      .card-type { font-size: clamp(10px, 2vw, 13px); color: #9aa5b1; letter-spacing: 1px; }
      .reveal-collect {
        font-size: 20px;
        background: #3cab4b;
        color: #fff;
        padding: 10px 34px;
        animation: titlepop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 1.1s both;
      }

      /* Feedback toast */
      .store-toast {
        position: fixed;
        left: 50%;
        top: 14%;
        transform: translateX(-50%);
        z-index: 30;
        font-size: 20px;
        font-weight: bold;
        color: #fff;
        padding: 10px 22px;
        border-radius: 14px;
        border: 3px solid #5a3e2b;
        box-shadow: 0 4px 0 rgba(0, 0, 0, 0.25);
        pointer-events: none;
        animation: toastfade 2s ease forwards;
      }
      .store-toast.good { background: #3cab4b; }
      .store-toast.bad { background: #c0392b; }
      @keyframes toastfade {
        0% { opacity: 0; transform: translateX(-50%) translateY(10px); }
        12%, 70% { opacity: 1; transform: translateX(-50%) translateY(0); }
        100% { opacity: 0; transform: translateX(-50%) translateY(-16px); }
      }

      /* — Batch 7: Crafting Center — */

      #craft-btn { cursor: pointer; border: none; font-family: inherit; }
      #craft-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,0.2); }

      .craft-sub {
        font-size: 13px;
        opacity: 0.85;
        margin: -4px 0 10px;
      }
      .craft-cards {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(108px, 1fr));
        gap: 10px;
        min-height: 60px;
      }
      .craft-empty {
        grid-column: 1 / -1;
        text-align: center;
        font-size: 15px;
        opacity: 0.7;
        padding: 16px 0;
      }
      .craft-card {
        cursor: pointer;
        font-family: inherit;
        color: #5a3e2b;
        background: #f6ead2;
        border: 3px solid #5a3e2b;
        border-radius: 14px;
        padding: 8px 6px;
        text-align: center;
        box-shadow: 0 3px 0 rgba(0, 0, 0, 0.15);
        transition: transform 0.1s ease;
      }
      .craft-card:hover { transform: translateY(-2px); border-color: #1fb6c9; }
      /* Selected = yellow outline, like the 2D game */
      .craft-card.selected {
        border-color: #f1c40f;
        box-shadow: 0 0 0 3px #f1c40f, 0 3px 0 rgba(0, 0, 0, 0.15);
        background: #fff6d8;
      }
      .craft-card-icon { font-size: 34px; line-height: 1.2; }
      .craft-card-name { font-size: 12px; font-weight: bold; min-height: 2.2em; }
      .craft-card-type { font-size: 10px; letter-spacing: 1px; opacity: 0.6; }
      .craft-card-parts {
        margin-top: 4px;
        font-size: 12px;
        font-weight: bold;
        background: rgba(31, 182, 201, 0.15);
        border-radius: 8px;
        padding: 2px 4px;
      }
      .craft-dragons-title {
        margin: 14px 0 6px;
        font-size: 15px;
        font-weight: bold;
        letter-spacing: 1px;
        color: #1f7a8c;
        border-top: 2px dotted rgba(90, 62, 43, 0.25);
        padding-top: 10px;
      }
      .craft-dragons {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding-bottom: 4px;
      }
      .craft-dragon {
        cursor: pointer;
        font-family: inherit;
        color: #5a3e2b;
        flex: 0 0 auto;
        width: 86px;
        background: #f6ead2;
        border: 3px solid #5a3e2b;
        border-radius: 14px;
        padding: 6px 4px;
        text-align: center;
      }
      .craft-dragon:hover { border-color: #1fb6c9; }
      .craft-dragon-thumb {
        width: 56px;
        height: 56px;
        font-size: 40px;
        line-height: 56px;
        margin: 0 auto;
        filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.25));
      }
      .craft-dragon-name { font-size: 10px; font-weight: bold; }
      .craft-actions { text-align: center; margin-top: 12px; }
      .craft-now-btn {
        font-size: 18px;
        background: #ff8c00;
        color: #fff;
        /* Glow pulse (not a transform — keeps the button hit-target still) */
        animation: craftpulse 1.2s ease-in-out infinite;
      }
      @keyframes craftpulse {
        0%, 100% { box-shadow: 0 3px 0 rgba(0, 0, 0, 0.2); }
        50% { box-shadow: 0 3px 0 rgba(0, 0, 0, 0.2), 0 0 18px 4px rgba(255, 140, 0, 0.75); }
      }

      /* Crafted-dragon celebration banner */
      .craft-banner {
        position: fixed;
        left: 50%;
        top: 22%;
        transform: translateX(-50%);
        z-index: 30;
        font-size: clamp(18px, 4vw, 28px);
        font-weight: bold;
        color: #2eff7b;
        background: rgba(0, 0, 0, 0.85);
        padding: 12px 26px;
        border-radius: 16px;
        border: 3px solid #fff;
        text-shadow: 0 2px 0 #000;
        pointer-events: none;
        white-space: nowrap;
        animation: craftbanner 4s ease forwards;
      }
      @keyframes craftbanner {
        0% { opacity: 0; transform: translateX(-50%) scale(0.4); }
        10%, 75% { opacity: 1; transform: translateX(-50%) scale(1); }
        100% { opacity: 0; transform: translateX(-50%) translateY(-40px) scale(1); }
      }

      /* Backpack card collection */
      #backpack-cards h4 {
        margin: 10px 0 4px;
        font-size: 15px;
        border-top: 2px dotted rgba(90, 62, 43, 0.25);
        padding-top: 8px;
      }
      #backpack-cards ul { list-style: none; margin: 0; padding: 0; }
      #backpack-cards li {
        display: flex;
        justify-content: space-between;
        padding: 4px 2px;
        font-size: 14px;
      }
      #backpack-cards .empty { font-size: 13px; opacity: 0.7; }

      @media (max-width: 640px) {
        #dragon-panel { width: 56vw; }
        #top-left { max-width: 52vw; }
        .hud-chip { font-size: 15px; padding: 5px 9px; }
      }
    </style>
  </head>
  <body>
    <canvas id="game-canvas"></canvas>

    <div id="top-left">
      <div id="resource-bar"></div>
      <span class="hud-chip" id="hint">WASD / Arrows to walk · Walk into 🌳 trees &amp; 🪨 rocks to harvest · Click a dragon to care for it · Drag to orbit</span>
    </div>

    <div id="top-right">
      <span class="hud-chip" id="fps">-- fps</span>
      <button class="hud-chip" id="store-btn">🛒 Store</button>
      <button class="hud-chip" id="craft-btn">⚒️ Craft</button>
      <button class="hud-chip" id="backpack-btn">🎒 Backpack</button>
    </div>

    <div id="backpack-panel">
      <h3>🎒 Backpack <button id="backpack-close">✕</button></h3>
      <ul id="backpack-list"></ul>
      <div id="backpack-cards"></div>
    </div>

    <div class="overlay-panel" id="store-panel"></div>
    <div class="overlay-panel" id="pack-panel"></div>
    <div class="overlay-panel" id="craft-panel"></div>

    <div id="dragon-panel" class="hidden"></div>

    <script type="module" src="/src3d/main.js"></script>
  </body>
</html>
